# Actualisation hebdomadaire automatique :
#   1. tests  2. pipeline ETL  3. rapport Quarto  4. commit des exports  5. publication GitHub Pages
name: Pipeline hebdomadaire

on:
  schedule:
    - cron: "17 6 * * 3"     # chaque mercredi à 06:17 UTC (cotations UE publiées en début de semaine)
  workflow_dispatch:          # lancement manuel possible depuis l'onglet Actions
  push:
    branches: [main]
    paths: ["R/**", "sql/**", "run_pipeline.R", "analyse/**", "tests/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true    # binaires précompilés : installation rapide

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr2
            any::jsonlite
            any::dplyr
            any::tidyr
            any::readr
            any::DBI
            any::duckdb
            any::forecast
            any::ggplot2
            any::knitr
            any::rmarkdown
            any::testthat

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Tests
        run: Rscript tests/testthat.R

      - name: Pipeline ETL
        run: Rscript run_pipeline.R

      - name: Rapport de prévision
        run: |
          quarto render analyse/prevision_prix.qmd
          mkdir -p site
          cp analyse/prevision_prix.html site/index.html

      - name: Commit des données actualisées
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw data/powerbi/*.csv data/qc
          git diff --cached --quiet || git commit -m "Actualisation des données ($(date +%F))"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: pipeline
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
